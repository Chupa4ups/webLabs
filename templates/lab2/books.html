{% extends "base.html" %}

{% block lab %}Лабораторная работа 2. Книги{% endblock %}

{% block main %}
    <h1>Список книг</h1>
    
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>№</th>
                <th>Автор</th>
                <th>Название</th>
                <th>Жанр</th>
                <th>Страниц</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.title }}</td>
                <td>{{ book.genre }}</td>
                <td>{{ book.pages }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
